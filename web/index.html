<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Afectiva - Interfaz UX</title>
    <!-- Tipografía limpia y moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- ZONA DEL ROSTRO (Ocupará todo el centro) -->
    <div class="zona-avatar">
        <div class="avatar-container" id="avatar">
            <svg viewBox="0 0 200 200" id="cara-svg">
                <circle cx="55" cy="115" r="14" fill="#ffb6c1" opacity="0.7" class="rubor"/>
                <circle cx="145" cy="115" r="14" fill="#ffb6c1" opacity="0.7" class="rubor"/>
                <path class="ceja" id="ceja-izq" d="M 55 75 Q 65 70 75 75" stroke="#2c3e50" stroke-width="4" stroke-linecap="round" fill="none"/>
                <path class="ceja" id="ceja-der" d="M 125 75 Q 135 70 145 75" stroke="#2c3e50" stroke-width="4" stroke-linecap="round" fill="none"/>
                <ellipse class="ojo" id="ojo-izq" cx="65" cy="95" rx="9" ry="14" fill="#2c3e50"/>
                <ellipse class="ojo" id="ojo-der" cx="135" cy="95" rx="9" ry="14" fill="#2c3e50"/>
                <circle cx="68" cy="90" r="4" fill="#ffffff"/>
                <circle cx="138" cy="90" r="4" fill="#ffffff"/>
                <path class="boca" id="boca" d="M 85 125 Q 100 135 115 125" stroke="#2c3e50" stroke-width="5" stroke-linecap="round" fill="none"/>
            </svg>
        </div>
        <div class="estado-texto" id="estado-texto">Esperando tu pregunta...</div>
    </div>

    <!-- ZONA DE INTERACCIÓN (Panel flotante inferior) -->
    <div class="zona-interaccion">
        <div class="chat-historial" id="chat-historial">
            <div class="mensaje mensaje-ia">¡Hola! Soy tu asistente. Pregúntame lo que quieras.</div>
        </div>
        
        <div class="chat-input-container">
            <input type="text" id="input-pregunta" placeholder="Escribe tu pregunta aquí..." autocomplete="off">
            <button id="btn-enviar">Enviar</button>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
