<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Afectiva - Interfaz UX</title>
    <!-- Tipografía limpia y moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
    <!-- ZONA DEL ROSTRO (Ocupará todo el centro) -->
    <div class="zona-avatar">
        <div class="avatar-container" id="avatar">
            <svg viewBox="0 0 200 200" id="cara-svg">
                <!-- Rubor (Cachetes) -->
                <circle cx="55" cy="115" r="14" fill="#ffb6c1" opacity="0.7" id="rubor-izq" style="transition: all 0.3s ease;"/>
                <circle cx="145" cy="115" r="14" fill="#ffb6c1" opacity="0.7" id="rubor-der" style="transition: all 0.3s ease;"/>
                
                <!-- Cejas -->
                <path class="ceja" id="ceja-izq" d="M 55 75 Q 65 70 75 75" stroke="#2c3e50" stroke-width="4" stroke-linecap="round" fill="none" style="transition: d 0.3s ease;"/>
                <path class="ceja" id="ceja-der" d="M 125 75 Q 135 70 145 75" stroke="#2c3e50" stroke-width="4" stroke-linecap="round" fill="none" style="transition: d 0.3s ease;"/>

                <!-- Ojos -->
                <ellipse class="ojo" id="ojo-izq" cx="65" cy="95" rx="9" ry="14" fill="#2c3e50" style="transition: all 0.3s ease;"/>
                <ellipse class="ojo" id="ojo-der" cx="135" cy="95" rx="9" ry="14" fill="#2c3e50" style="transition: all 0.3s ease;"/>
                
                <!-- Brillo de ojos (desaparecen cuando cierra los ojos) -->
                <circle id="brillo-izq" cx="68" cy="90" r="4" fill="#ffffff" style="transition: opacity 0.3s ease;"/>
                <circle id="brillo-der" cx="138" cy="90" r="4" fill="#ffffff" style="transition: opacity 0.3s ease;"/>

                <!-- Boca -->
                <path class="boca" id="boca" d="M 85 125 Q 100 135 115 125" stroke="#2c3e50" stroke-width="5" stroke-linecap="round" fill="none" style="transition: d 0.3s ease;"/>

                <!-- Efectos especiales para Tristeza (Ocultos por defecto) -->
                <g id="efectos-animar" style="opacity: 0; transition: opacity 0.5s ease;">
                    <text x="25" y="60" font-size="25">🎶</text>
                    <text x="145" y="55" font-size="25">💖</text>
                    <text x="160" y="90" font-size="20">🎵</text>
                </g>
            </svg>
        </div>
        <div class="estado-texto" id="estado-texto">Esperando tu pregunta...</div>
    </div>

    <!-- ZONA DE INTERACCIÓN (Panel flotante inferior) -->
    <div class="zona-interaccion">
        <div class="chat-historial" id="chat-historial">
            <div class="mensaje mensaje-ia">¡Hola! Soy tu asistente. Pregúntame lo que quieras.</div>
        </div>
        
        <div class="chat-input-container">

            <input type="text" id="input-pregunta" placeholder="Escribe tu pregunta aquí..." autocomplete="off">
            
            <button id="btn-mic" class="mic-btn" title="Dictar pregunta">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
            </button>
           
            <button id="btn-enviar">Enviar</button>
        </div>
    </div>

    <script src="/static/app.js?v=3"></script>
</body>
</html>
